services:

  # ── Base de datos ────────────────────────────────────────────────────
  db:
    image: mysql:8
    container_name: vet_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpassword}
      MYSQL_DATABASE:      ${DB_NAME:-veterinaria}
      MYSQL_USER:          ${DB_USER:-vet_user}
      MYSQL_PASSWORD:      ${DB_PASS:-vet_pass}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - vet_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API (Node.js / Express) ──────────────────────────────────────────
  backend:
    build: ./backend
    container_name: vet_backend
    restart: unless-stopped
    environment:
      PORT:          4001
      DB_HOST:       db
      DB_PORT:       3306
      DB_NAME:       ${DB_NAME:-veterinaria}
      DB_USER:       ${DB_USER:-vet_user}
      DB_PASS:       ${DB_PASS:-vet_pass}
      JWT_SECRET:    ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL:  http://localhost
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vet_net

  # ── Frontend (React build servida con nginx) ─────────────────────────
  frontend:
    build: ./frontend
    container_name: vet_frontend
    restart: unless-stopped
    networks:
      - vet_net

  # ── Nginx (reverse proxy público) ───────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: vet_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - vet_net

# ── Volúmenes ────────────────────────────────────────────────────────
volumes:
  db_data:
  uploads_data:

# ── Red interna ──────────────────────────────────────────────────────
networks:
  vet_net:
    driver: bridge
